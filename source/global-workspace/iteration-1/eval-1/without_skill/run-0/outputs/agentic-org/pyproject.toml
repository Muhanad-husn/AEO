[project]
name = "ai-enterprise-template"
version = "0.1.0"
description = "A one-operator AI software enterprise template: tool-locked role subagents build, two hook gates hold the line, the founder merges."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
