# This workflow is the only place both tiers are enforced (D17, as amended by D30).
# D30 deleted the commit gate, so nothing local runs either tier before a commit any
# more. That is L-06's cost, accepted with its name on it in D17: a gate regression is
# discovered in CI rather than at commit time. Only a required status check on the
# default branch makes a red suite here block a merge — D30 leans on that check rather
# than restoring the local one.
#
# Runs on ubuntu-latest. The suites spawn `git`, `node` and `sh`, all of which the
# runner has; observed green on the runner.

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  battery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No install step and no dependencies, by design: node --test only.
      #
      # GH_TOKEN arms the L-08 group in tests/skills/classify-branches.test.mjs. Those
      # three tests need an authenticated gh — they assert that a FAILED `gh pr list` is
      # reported as missing data rather than as "no PRs" — and they skip loudly without
      # one, so the first green Linux run covered everything except the rule the file was
      # written to enforce. gh is preinstalled here; only the auth was missing.
      #
      # No API traffic follows. The fixture repository points at https://example.invalid,
      # so the query fails on DNS whether or not a token exists. The token exists to make
      # `gh auth status` succeed, nothing more, which is why read-only is enough.
      #
      # The live score test runs only here, against a fresh clone. The fast tier never
      # touches the network; `npm test` has no network step.
      #
      # RLM is a private repository, and github.token reads only this one. The clone
      # needs RLM_READ_TOKEN, a fine-grained token with read access to RLM's contents,
      # pull requests and issues, stored as a repository secret. Without the secret the
      # clone step does not run and the live test skips with its reason, so a missing
      # token shows up as a skip in the log, never as a red.
      - run: gh repo clone Muhanad-husn/RLM "$RUNNER_TEMP/rlm"
        if: env.RLM_READ_TOKEN != ''
        env:
          RLM_READ_TOKEN: ${{ secrets.RLM_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.RLM_READ_TOKEN }}
      - run: npm run test:all
        env:
          GH_TOKEN: ${{ secrets.RLM_READ_TOKEN || github.token }}
          AEO_RLM_CLONE: ${{ runner.temp }}/rlm
